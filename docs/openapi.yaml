openapi: 3.1.0
info:
  title: memloom local API
  version: 0.1.0
  description: |
    The HTTP API served by the `memloom serve` daemon on your machine. The CLI, the MCP server,
    and the viewer all route through this API. The daemon is the single owner of the store, so
    every client shares one consistent view of your memories.

    No authentication: the daemon binds to `127.0.0.1` only and is reachable solely from your
    own machine. Browser clients on other localhost ports are allowed via CORS.
servers:
  - url: http://127.0.0.1:4319
    description: Local memloom daemon
paths:
  /health:
    get:
      summary: Health check
      description: Returns ok when the daemon is up. Used by clients to detect a running daemon.
      operationId: health
      responses:
        "200":
          description: Daemon is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /memory/save:
    post:
      summary: Save a memory
      description: |
        Save a memory through the belief pipeline: exact-duplicate detection, semantic dedup, and
        contradiction detection. A contradiction keeps **both** memories active and returns
        `outcome: conflict` with a `conflictId` for you to resolve. Nothing is overwritten.

        In offline mode (no `OPENROUTER_API_KEY`) dedup is off and every save is `added`.
      operationId: saveMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveInput"
      responses:
        "200":
          description: The save decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/StoreLocked"
  /memory/query:
    post:
      summary: Recall memories
      description: |
        Hybrid retrieval over active memories: vector similarity + exact keyword + entity match,
        fused with reciprocal-rank fusion. Results are ordered by `rrfScore`, which is rank-based
        and small by design (about 0.03 max). `similarity` is the plain cosine similarity score.
      operationId: queryMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: What to recall, in natural language or exact identifiers.
                  example: what are my plans for today
                limit:
                  type: integer
                  description: Maximum results (default 10).
                  example: 5
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/StoreLocked"
        "200":
          description: Ranked memories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Memory"
  /memory/list:
    get:
      summary: List all active memories
      description: |
        Every active memory, newest first. Use this to browse the store; use /memory/query
        for relevance-ranked recall. Stale (superseded) memories are excluded.
      operationId: listMemories
      responses:
        "200":
          description: The active memories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Memory"
  /memory/{id}/update:
    post:
      summary: Edit a memory into a new version
      description: |
        An explicit edit: unlike a `save` that happens to resemble an existing memory, this
        always creates a new version, no dedup classifier involved. The target must be an
        active belief; the edited version goes stale and stays visible in `history`.
      operationId: updateMemory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Any version's id in the belief's lineage works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: the staging database runs on Postgres 18
                canonical:
                  type: string
                  description: Optional short canonical form used for exact-duplicate detection.
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Id of the new current version (a fresh row; the edited one is now stale).
                  rootId:
                    type: string
                    description: The belief's stable lineage id, unchanged across versions.
                  version:
                    type: integer
                    example: 2
  /memory/{id}/history:
    get:
      summary: A memory's full version chain
      description: |
        Every version of the belief, newest first, including stale ones. History is the one
        place a stale version is still visible; recall never returns them. Any version's id
        in the chain works as `id`.
      operationId: getMemoryHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The version chain, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Memory"
  /memory/{id}:
    delete:
      summary: Delete a memory's whole belief
      description: |
        Deletes every version in the lineage, its edges, and any pending conflict that names
        it. Unlike a resolution's `stale`, this is permanent; there is no revert.
      operationId: deleteMemory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "400":
          description: Delete failed for a reason other than "not found".
        "404":
          description: No memory with that id.
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /memory/passage/{id}:
    get:
      summary: The full text behind a truncated recall result
      description: |
        A recall hit's content can be truncated for display; this returns the complete text
        of one memory or context chunk by id. What the MCP `read_passage` tool and the
        assistant's citation links call to fetch the rest.
      operationId: getPassage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: A memory id or a context-chunk id, as returned in a recall result.
      responses:
        "404":
          description: No memory or chunk with that id.
        "200":
          description: The full text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
  /memory/index:
    post:
      summary: Index memories and context chunks (extract entities)
      description: |
        Extract entities from memories AND context chunks that have not been indexed yet and
        link them into the graph with mention edges. Runs the LLM extractor (one call per row,
        so large documents take proportionally longer); a no-op in offline mode.
      operationId: indexMemories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: How many memories and context chunks were indexed in this run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexed:
                    type: integer
                    description: Memories processed this run.
                    example: 3
                  chunksIndexed:
                    type: integer
                    description: Context chunks processed this run.
                    example: 12
  /memory/index/stream:
    post:
      summary: Index with real-time progress (NDJSON stream)
      description: |
        Same work as /memory/index, but the response streams newline-delimited JSON as it
        runs: one `{"type":"item"}` event per processed memory/chunk (with its label, 1-based
        position, total, and extracted entity names), then a final `{"type":"done"}` event
        with the run totals. Failures mid-run arrive in-band as `{"type":"error"}`.
      operationId: indexMemoriesStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
          content:
            application/x-ndjson:
              schema:
                type: string
                example: |
                  {"type":"item","kind":"chunk","id":"...","label":"runbook.pdf › DATABASE FAILOVER","index":3,"total":46,"entities":["Postgres"]}
                  {"type":"done","indexed":0,"chunksIndexed":46}
  /memory/reindex:
    post:
      summary: Rebuild the graph from scratch
      description: |
        Wipes every extracted artifact (all entities, their mention edges, and all typed
        entity-to-entity edges), then re-runs indexing over everything. Belief edges
        (replaces, distinct) are never touched. Use it to recover when an older extraction
        pipeline polluted the graph.
      operationId: reindexMemories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: How many memories and context chunks were re-indexed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexed:
                    type: integer
                  chunksIndexed:
                    type: integer
  /memory/reindex/stream:
    post:
      summary: Rebuild with real-time progress (NDJSON stream)
      description: |
        Same work as /memory/reindex, streamed as newline-delimited JSON in the same shape
        as /memory/index/stream (item events, then done; errors in-band).
      operationId: reindexMemoriesStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
          content:
            application/x-ndjson:
              schema:
                type: string
  /memory/index/runs:
    get:
      summary: Index sessions (persistent run history)
      description: |
        Every index/reindex pass is recorded as a run: trigger (index|rebuild), status
        (running|success|warning|error|interrupted), batch size, per-kind indexed counts,
        failures, and entity/relation totals. Newest first. The viewer's Console polls this
        while a run is live; history survives restarts and includes CLI runs.
      operationId: listIndexRuns
      responses:
        "200":
          description: Runs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        trigger: { type: string, enum: [index, rebuild] }
                        status:
                          type: string
                          enum: [running, success, warning, error, interrupted]
                        batchSize: { type: integer, example: 14 }
                        memoriesIndexed: { type: integer }
                        chunksIndexed: { type: integer }
                        itemsFailed: { type: integer }
                        entitiesLinked: { type: integer }
                        relationsCreated: { type: integer }
                        startedAt: { type: string, format: date-time }
                        finishedAt: { type: string, format: date-time, nullable: true }
    delete:
      summary: Clear the whole indexing history
      operationId: clearIndexRuns
      responses:
        "200":
          description: All runs and their events deleted.
  /memory/index/runs/{id}/events:
    get:
      summary: The per-item log lines of one run
      operationId: getIndexRunEvents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Events, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        level: { type: string, enum: [info, success, warning, error] }
                        message:
                          type: string
                          example: "[3/12] chunk notes.pdf › Intro → Postgres (+1 relationship)"
                        itemId: { type: string, format: uuid, nullable: true }
                        metadata: { type: object }
                        createdAt: { type: string, format: date-time }
  /memory/index/runs/{id}:
    delete:
      summary: Delete one run session (its events cascade)
      operationId: deleteIndexRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
  /import/sessions/stream:
    post:
      summary: Distill agent sessions into memories
      description: |
        Distills local Claude Code transcripts into typed memories. Per session: check the
        ledger, redact secret-shaped strings, chunk, distill, embed, and save through the belief
        pipeline. The path is fixed to `~/.claude/projects`; a client cannot pass an arbitrary
        one.

        NDJSON: one `{"type":"item"}` per session, then `{"type":"done"}` with totals and the
        cost line. A dry run makes zero model calls and writes nothing.
      operationId: importSessionsStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                  description: Which agent's sessions to import. Default and only supported value today is claude-code.
                  example: claude-code
                days:
                  type: integer
                  description: Widen the day window (default 14).
                  example: 60
                maxSessions:
                  type: integer
                  description: Raise the session cap (default 20).
                  example: 100
                project:
                  type: string
                  description: Only sessions whose project folder name contains this substring.
                  example: myapp
                dryRun:
                  type: boolean
                  description: List what would be processed; no LLM calls, no writes.
                force:
                  type: boolean
                  description: Ignore the ledger and reprocess every discovered session from the start.
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
          content:
            application/x-ndjson:
              schema:
                type: string
                example: |
                  {"type":"item","path":"/home/me/.claude/projects/-home-me-app/3f2a....jsonl","project":"app","sessionId":"3f2a...","index":1,"total":3,"outcome":"imported","chunks":2,"saved":4,"merged":0,"versioned":1,"conflicts":0,"autoResolved":0,"dropped":0,"truncated":0,"redactions":1,"malformed":0}
                  {"type":"done","sessions":3,"skipped":{"sidecars":0,"active":0,"outsideWindow":2,"overCap":0,"upToDate":1},"saved":4,"merged":0,"versioned":1,"conflicts":0,"autoResolved":0,"dropped":0,"truncated":0,"redactions":1,"malformed":0,"calls":{"extraction":2,"embedding":2,"classifier":1},"dryRun":false}
  /notion/pages:
    get:
      summary: List Notion pages the integration can see
      description: |
        What the connect picker renders. Lists every page, database, and data source shared
        with the configured Notion integration, with parent references so clients can show
        the workspace as a tree (database row-pages collapse under their database). Requires
        NOTION_TOKEN in the daemon's environment; the token never crosses this API.
      operationId: notionListPages
      responses:
        "200":
          description: The listing, with parent references.
  /notion/status:
    get:
      summary: Notion connector status
      description: |
        Whether a token is configured, the current selection, the last sync time and error,
        whether a sync is running, and how many notion:// documents exist.
      operationId: notionStatus
      responses:
        "200":
          description: The connector status.
  /notion/scope:
    put:
      summary: Set which Notion items sync
      description: |
        Replaces the sync selection. Pass the items to sync, or null to disconnect (synced
        documents stay). What `memloom notion connect` and the viewer's connectors tab call.
      operationId: setNotionScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  description: The items to sync, or null to disconnect.
      responses:
        "200":
          description: Scope stored.
        "400":
          $ref: "#/components/responses/ValidationError"
  /notion/sync/stream:
    post:
      summary: Sync the selected Notion items now
      description: |
        What `memloom notion sync` calls (the daemon also runs it on a poll timer). For each
        selected item: asks Notion whether it changed, refetches only the sections whose
        last_edited_time moved (cached block tree), renders to markdown, and re-ingests
        chunk-stably so unchanged chunks keep their rows and embeddings. The response
        streams NDJSON: one {"type":"item"} event per page plus fetch-progress events, then
        {"type":"done"} with the totals. A dry run fetches no page content and writes
        nothing.
      operationId: notionSyncStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  description: List what would sync; no content fetches, no writes.
                force:
                  type: boolean
                  description: Ignore caches and refetch every selected item in full.
                wait:
                  type: boolean
                  description: If a sync is already running, queue behind it instead of failing.
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
  /import/agent-memory/stream:
    post:
      summary: Import memories agents already saved on disk
      description: |
        What `memloom import agent-memory` calls. Discovers the agents' own well-known
        memory folders (Claude Code per-project memory directories, GitHub Copilot's
        memory-tool notes; the client never supplies a filesystem path), parses each file
        into memories, redacts secret-shaped strings, and saves through the belief
        pipeline. No LLM extraction: the files are already distilled. A content-hash
        ledger skips unchanged memories, so re-runs are free. The response streams NDJSON:
        one `{"type":"item"}` event per folder, then `{"type":"done"}` with the totals.
      operationId: importAgentMemoryStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agents:
                  type: array
                  items:
                    type: string
                  description: Only these agents (claude-code, copilot). Default both.
                project:
                  type: string
                  description: Only Claude Code projects whose folder name contains this substring.
                dryRun:
                  type: boolean
                  description: List folders and counts; no provider calls, no writes.
                force:
                  type: boolean
                  description: Re-import everything, ignoring the content-hash ledger.
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
  /import/claude-code/notify:
    post:
      summary: Notify the daemon a Claude Code session ended
      description: |
        What the Claude Code session-end hook installed by `memloom connect claude-code`
        calls. Distills exactly the one session at `path` in the background: the hook gets a
        202 immediately and never waits on distillation, so a slow LLM call can't hang the
        editor. `path` must resolve inside `~/.claude/projects` and end in `.jsonl`; anything
        else is rejected before it reaches the filesystem. Subject to the daily unattended
        call budget reported at `/import/claude-code/status`.
      operationId: notifyClaudeCodeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path to the session's .jsonl transcript.
                  example: /home/me/.claude/projects/-home-me-app/3f2a1c9e-....jsonl
      responses:
        "400":
          description: Path is outside the Claude Code sessions directory, or not a .jsonl file.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "202":
          description: Accepted; distillation runs in the background.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
  /import/claude-code/status:
    get:
      summary: Continuous capture status
      description: |
        What `memloom status` renders for `connect claude-code`: the configured capture
        scope, when the hook last fired and whether it failed, today's unattended
        distillation spend against the daily cap, and ledger totals across every import so
        far (sessions and memories, regardless of trigger).
      operationId: importClaudeCodeStatus
      responses:
        "200":
          description: Capture status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportStatus"
  /import/claude-code/scope:
    put:
      summary: Set the continuous-capture allowlist
      description: |
        What `memloom connect claude-code --project X` and `--all` set. `null` (the default)
        captures nothing: naming a scope is the consent step, since the hook fires for every
        Claude Code session on the machine, including client work and repos whose code
        should never reach an LLM provider. `{"projects":[...]}` captures only sessions whose
        project folder name contains one of the given substrings; `"all"` captures every
        project.
      operationId: setImportScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  oneOf:
                    - type: string
                      enum: [all]
                    - type: object
                      required: [projects]
                      properties:
                        projects:
                          type: array
                          items:
                            type: string
                          example: [myapp]
                    - type: "null"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Scope updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /memory/schema:
    get:
      summary: The graph schema registry with live counts
      description: |
        The vocabularies the indexer extracts against: entity types and typed-relationship
        predicates as registry rows (tier system/user, status active/disabled), edge
        relations from the engine, and the LLM proposal review queue (names the extractor
        wanted, with occurrence counts).
      operationId: getSchema
      responses:
        "200":
          description: Entity types, relations, predicates with counts, and pending proposals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entityTypes:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/SchemaEntry"
                        - type: object
                          properties:
                            count:
                              type: integer
                              description: Entities currently extracted under this type.
                              example: 12
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, example: mention }
                        description: { type: string }
                        count: { type: integer }
                  predicates:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/SchemaEntry"
                        - type: object
                          properties:
                            count:
                              type: integer
                              description: Typed edges currently using this predicate.
                  proposals:
                    type: array
                    description: >-
                      The LLM proposal review queue: names the extractor wanted often enough to
                      surface, with the saved occurrences behind them. Approve or dismiss via the
                      schema id endpoints.
                    items:
                      $ref: "#/components/schemas/SchemaEntry"
    post:
      summary: Add a user-tier vocabulary entry
      description: |
        Add an entity type or predicate to the extraction vocabulary. The name is normalized
        to snake_case; the description becomes part of the extraction prompt, so write it
        like a rule ("a named drug or supplement"). Takes effect on the next index run.
      operationId: addSchemaEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind:
                  type: string
                  enum: [entity_type, predicate]
                name:
                  type: string
                  example: medication
                description:
                  type: string
                  example: a named drug or supplement
      responses:
        "200":
          description: The created (or re-activated) entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
  /memory/schema/{id}:
    patch:
      summary: Enable or disable a vocabulary entry
      description: |
        Disabled entries leave the extraction prompt; entities already extracted under them
        stay in the graph. Works on system and user tiers (proposals have their own
        approve/dismiss lifecycle).
      operationId: setSchemaStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: Delete a disabled user-tier entry
      description: |
        Permanently remove a vocabulary entry. Only **disabled user-tier** entries qualify:
        built-in entries are re-seeded by name on the next run (a delete would bring them
        back active), so disabling is the only way to turn them off, and proposals are
        approved or dismissed instead. Entities already extracted under the deleted type
        stay in the graph.
      operationId: deleteSchemaEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: No such entry.
        "409":
          description: The entry exists but is not deletable (still active, a built-in, or a proposal); the error names the reason.
  /memory/schema/{id}/approve:
    post:
      summary: Approve a proposal
      description: Promote a proposed name to the user tier and link its saved occurrences into the graph immediately (no re-index needed). The extractor also starts using the name on the next index run.
      operationId: approveProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
  /memory/schema/{id}/dismiss:
    post:
      summary: Dismiss a proposal
      description: Reject a proposed name. The prompt blocklists it, so the extractor never proposes it again.
      operationId: dismissProposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
  /memory/auto-index:
    get:
      summary: Auto-index state
      description: |
        Whether new memories and files are entity-indexed automatically in the background
        (debounced runs a few seconds after a save/ingest). `available` is false in offline
        mode: extraction needs an LLM, so there is nothing to toggle.
      operationId: getAutoIndex
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean, example: true }
                  available: { type: boolean, example: true }
    patch:
      summary: Turn auto-index on or off
      description: |
        The Console's toggle. Persisted in the store, so the choice survives daemon
        restarts; the MEMLOOM_AUTO_INDEX config value is only the default before the
        toggle is first used. Refused with 409 in offline mode.
      operationId: setAutoIndex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: No LLM configured; auto-index cannot be enabled.
  /memory/entities:
    get:
      summary: List entities with usage counts
      description: |
        Every extracted entity with its usage: active mention edges, distinct memories, and
        distinct documents that mention it. Most-mentioned first. Use this list to manage
        entities; /memory/graph shows the same data as a graph.
      operationId: listEntities
      responses:
        "200":
          description: The entities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntityDetail"
  /memory/entities/related:
    get:
      summary: Walk the graph from one entity
      description: |
        Everything connected to one entity. The target may be an id, a name, or a folded-away
        spelling, which resolves to its canonical with `matchedAlias` naming what was asked for.
        Matched exactly, not by meaning: this is a graph lookup, not a search.

        Two kinds of connection come back separately and are never blended. **Stated** links are
        typed edges extraction asserted, with direction. **Co-mention** is entities named by the
        same sources, which is weaker and never outranks a stated link.
      operationId: relatedEntities
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: An entity id, name, or known alias.
          example: Bob
        - name: type
          in: query
          schema:
            type: string
          description: Only return neighbours of this entity type.
          example: person
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: The entity and its neighbourhood.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedEntities"
        "400":
          description: q is missing.
        "404":
          description: No entity matches the target.
  /memory/entities/resolve:
    post:
      summary: Find and fold duplicate entity spellings
      description: |
        One resolution pass over the entity table. Spellings that are identical apart from
        case and punctuation are folded without asking; uncertain pairs are written to the
        conflicts queue for review. Idempotent and safe to re-run.

        The queue is capped so entity folds cannot bury memory conflicts. Questions that did
        not fit are reported as `deferred` rather than dropped silently, and a later pass
        picks them up as answers come in.
      operationId: resolveEntities
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: false
                  description: Report the plan without changing anything.
      responses:
        "200":
          description: What the pass did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntityResolutionResult"
  /memory/entities/conflicts:
    get:
      summary: List uncertain entity folds awaiting review
      description: |
        Pairs the resolver was not confident enough to fold. Resolve them through
        POST /memory/conflicts/{id}/resolve like a memory conflict: `keep_existing` folds the
        queued spelling into the candidate, `keep_new` folds the other way, `keep_both`
        settles them as different things. `merge` does not apply to entities.

        These never appear in GET /memory/conflicts, which is scoped to memory
        contradictions.
      operationId: listEntityConflicts
      responses:
        "200":
          description: The pending folds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntityConflict"
  /memory/entities/settled:
    get:
      summary: List entity pairs settled as different things
      description: >-
        Pairs a human or a model decided are not the same thing. Recorded so the resolver never
        raises them again. Reverting one puts the question back in the queue.
      operationId: listSettledEntityPairs
      responses:
        "200":
          description: The settled pairs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled:
                    type: array
                    items:
                      $ref: "#/components/schemas/SettledEntityPair"
  /memory/entities/resolve-auto:
    post:
      summary: Let a model settle the queued entity pairs
      description: |
        Asks a model about every pair the lexical rules could not settle, folding the ones it is
        confident about and leaving the rest queued. One call per pair, so it is never a side
        effect of anything else.

        This is the same work the `llm_entities` reconcile pass does. Refused with 403 when
        `RECONCILE_ENABLED=0`, because it spends money.
      operationId: autoResolveEntities
      responses:
        "200":
          description: What the model settled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  calls:
                    type: integer
                    description: One per pair the model was asked about.
                  folded:
                    type: integer
                  rejected:
                    type: integer
                    description: Pairs settled as different things, so they are never asked again.
                  unsure:
                    type: integer
                    description: Left queued for a human.
        "403":
          description: Reconciliation is set to report only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: reconciliation is set to report only (RECONCILE_ENABLED=0).
  /memory/entities/resolve-auto/stream:
    post:
      summary: Let a model settle the queued entity pairs (NDJSON stream)
      description: >-
        The same work, reported as it goes. One `{"type":"item"}` per pair judged, a
        `{"type":"ping"}` every 15 seconds so the pipe never times out, and a final
        `{"type":"done"}` carrying the totals. A mid-stream failure arrives as
        `{"type":"error"}`, since the response has already started.
      operationId: autoResolveEntitiesStream
      responses:
        "200":
          description: NDJSON, one JSON object per line.
          content:
            application/x-ndjson:
              schema:
                type: string
        "403":
          description: Reconciliation is set to report only.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: reconciliation is set to report only (RECONCILE_ENABLED=0).
  /memory/entities/merges:
    get:
      summary: List entity folds
      description: |
        Every fold, newest first, including reverted ones (`revertedAt` is set). `decidedBy`
        says what applied it: `auto` for a deterministic spelling match, `human` for a fold
        you applied, `llm` for a future arbitration tier.
      operationId: listEntityMerges
      responses:
        "200":
          description: The folds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  merges:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntityMerge"
  /memory/entities/merges/{id}/revert:
    post:
      summary: Undo an entity fold
      description: |
        Restores the absorbed entity with its original id, type, vector and creation time,
        repoints exactly the edges the fold moved, reactivates exactly the edges it
        deactivated, and removes the alias. The original id matters because deactivated edges
        still point at it.
      operationId: revertEntityMerge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reverted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: The fold was already reverted.
        "404":
          description: No such fold.
  /memory/entities/{id}:
    patch:
      summary: Rename or retype an entity
      description: |
        A rename re-embeds the entity, since the embedding is computed from the name. It is
        refused with 409 when another entity already owns that name key; use merge instead.
        A retype must name an active vocabulary type.
      operationId: updateEntity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: PostgreSQL
                entityType:
                  type: string
                  example: technology
      responses:
        "200":
          description: Entity updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: No such entity.
        "409":
          description: The new name collides with an existing entity.
    delete:
      summary: Delete an entity
      description: |
        Remove the entity and every edge touching it (mentions pointing at it, typed
        relationships from or to it). The memories and documents that mentioned it are
        untouched.

        Refused with 400 while an unreverted fold points at this entity: the alias row carries
        the absorbed entity's id and vector, so deleting would make that fold permanent.
        Revert the fold first.
      operationId: deleteEntity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entity deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: No such entity.
  /memory/entities/{id}/merge:
    post:
      summary: Merge an entity into another
      description: |
        Fold this entity into a surviving one. Every mention and relationship repoints to the
        target, duplicates and self-loops are dropped, and the absorbed spelling is kept as an
        alias so later mentions resolve to the survivor, which keeps its own name and type.

        Recorded and revertable through /memory/entities/merges. No lexical rule is applied, so
        this is how you declare two entities the same when nothing about their spelling says so,
        like a nickname and a full name.
      operationId: mergeEntity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The entity that disappears.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into]
              properties:
                into:
                  type: string
                  format: uuid
                  description: The surviving entity.
      responses:
        "200":
          description: Merged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Self-merge, or validation failure.
        "404":
          description: Either entity id is unknown.
  /memory/graph:
    get:
      summary: Get the memory graph
      description: |
        Returns active memories, extracted entities, and context documents as nodes, with
        the edges between them. Chunk-level mention edges are rolled up to one weighted
        document -> entity edge, so documents stay single nodes.
      operationId: getGraph
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
  /memory/conflicts:
    get:
      summary: List pending conflicts
      description: Contradictions the belief pipeline flagged that you have not resolved yet. Both sides stay active until you decide.
      operationId: listConflicts
      responses:
        "200":
          description: Pending conflicts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conflict"
  /memory/conflicts/resolved:
    get:
      summary: List resolved conflicts
      description: |
        The revertable history behind the pending queue, newest resolution first. Each entry
        carries the action that resolved it and can be undone via the revert endpoint.
      operationId: listResolvedConflicts
      responses:
        "200":
          description: Resolved conflicts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResolvedConflict"
  /memory/conflicts/{id}/resolve:
    post:
      summary: Resolve a conflict
      description: |
        Apply one of the four human-in-the-loop resolutions. Every resolution is non-destructive
        and reversible via the revert endpoint: losing memories are marked `stale` and kept
        in the store.
      operationId: resolveConflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The conflict id from the save response or the conflicts list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveDecision"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: Resolution applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /memory/conflicts/{id}/revert:
    post:
      summary: Revert a resolution
      description: Undo a previous resolution. Staled memories come back to active and the conflict returns to the pending list.
      operationId: revertConflict
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolution reverted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /memory/conflicts/resolve-auto/stream:
    post:
      summary: Auto-resolve pending conflicts with an LLM judge (NDJSON stream)
      description: |
        Re-judges every pending conflict with context the save-time classifier never had: when
        each side was recorded, and for imported memories the transcript excerpt behind it.

        Only a decisive verdict resolves anything, applied through the same path as the manual
        endpoint and just as revertable. `unsure` leaves the conflict pending. NDJSON: one
        `{"type":"item"}` per conflict, then `{"type":"done"}` with totals. Needs a model.
      operationId: autoResolveConflictsStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
          content:
            application/x-ndjson:
              schema:
                type: string
                example: |
                  {"type":"item","conflictId":"...","index":1,"total":3,"verdict":"keep_new","reason":"the newer session shows the change","content":"the deploy target is railway"}
                  {"type":"done","examined":3,"resolved":2,"keepNew":1,"keepExisting":0,"keepBoth":1,"unsure":1}
  /memory/reconcile:
    post:
      summary: Run the consolidation pass
      description: |
        Reviews the store, repairs what SQL proves wrong, folds duplicate entity names, and
        asks about the rest. Every run is one undoable unit: the report names the run id, and
        `/memory/reconcile/{id}/revert` puts back exactly what it did.

        `mode` defaults to `dry_run`, which changes nothing and never calls a model, returning
        what the paid passes would have cost in `estimate`. **The `memloom reconcile` CLI
        command defaults the other way and applies.**

        Passes come from the saved settings unless `passes` overrides them: two free ones on,
        three paid ones off. With the contradiction re-check on a run takes minutes, so use the
        stream variant rather than holding this request open. See
        [Reconciliation](https://docs.memloom.dev/concepts/reconciliation).
      operationId: reconcile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileInput"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: |
            `RECONCILE_ENABLED=0` is set on the daemon and `mode` is `apply`. The kill switch
            refuses any run that was asked to act; a dry run still works.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: reconciliation is set to report only (RECONCILE_ENABLED=0). Remove it from your memloom config and restart the daemon to let a run act.
        "409":
          description: Another applying run is already going. Watch it or wait for it to finish.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "memloom: a reconcile run is already going. Watch it in the Console, or wait for it to finish."
        "200":
          description: What the run found and what it changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileReport"
  /memory/reconcile/stream:
    post:
      summary: Run the consolidation pass (NDJSON stream)
      description: |
        The same run, reported as it goes. NDJSON: one `{"type":"item"}` per belief checked, a
        `{"type":"ping"}` every 15 seconds so the pipe never times out, and a final
        `{"type":"done"}` carrying the report. A mid-stream failure arrives as
        `{"type":"error"}`, since the response has already started.

        **Disconnecting stops the run**, so nothing more is spent. Every belief already checked
        stays checked. The first event names the run id.
      operationId: reconcileStream
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileInput"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: "`RECONCILE_ENABLED=0` is set on the daemon and `mode` is `apply`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: reconciliation is set to report only (RECONCILE_ENABLED=0).
        "200":
          description: NDJSON progress stream ending with a done (or error) event.
          content:
            application/x-ndjson:
              schema:
                type: string
                example: |
                  {"type":"item","runId":"0f2c7b18","pass":"llm_recheck","checked":1,"total":200,"found":0}
                  {"type":"item","runId":"0f2c7b18","pass":"llm_recheck","checked":2,"total":200,"found":1}
                  {"type":"done","run":{"id":"0f2c7b18","mode":"apply","status":"success"},"actions":[]}
  /memory/reconcile/runs:
    get:
      summary: List reconcile runs
      description: |
        Every run for this store, newest first, with what each one scanned, changed, and asked.
        This is the Console tab's history. A run with `status` `running` is still going and its
        counters move.
      operationId: listReconcileRuns
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Reconcile runs, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReconcileRun"
  /memory/reconcile/runs/{id}/actions:
    get:
      summary: List one run's findings
      description: |
        Everything the run recorded, including findings held back by a per-run cap
        (`surfaced: false`). An unknown id reads as an empty run rather than another store's
        ledger.
      operationId: listReconcileActions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The run's findings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReconcileAction"
  /memory/reconcile/settings:
    get:
      summary: Get the reconcile settings
      description: |
        Which passes a run does, and whether the daemon catches up on startup. Stored in the
        store rather than in `config.env`, so a change takes effect without a restart.
      operationId: getReconcileSettings
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileSettings"
    post:
      summary: Update the reconcile settings
      description: |
        Patch any subset. This is what the viewer's Settings tab writes. Turning on
        `llm_entities`, `llm_conflicts`, or `llm_recheck` is what allows a run started by hand
        to spend money; the daemon's own idle and startup runs stay on the free passes
        whatever is saved here.
      operationId: setReconcileSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileSettings"
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileSettings"
  /memory/reconcile/{id}/revert:
    post:
      summary: Undo one reconcile run
      description: |
        Put back exactly what one run did, and only that run. A retired memory is reactivated
        only while it is still stale and its `stale_since` is the one this run wrote, so a
        newer decision is never overridden. A fold goes back through the same revert entity
        resolution uses. A conflict the run raised and nobody answered is removed from the
        queue; one that was answered is left alone and counted in `skipped`. Reverting twice
        is a no-op.
      operationId: revertReconcile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "409":
          description: >-
            The run exists but the undo could not complete, for example because the store has
            moved on from what it did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          description: No such run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "memloom: no reconcile run 0f2c7b18"
        "200":
          description: What the undo restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                    format: uuid
                  restored:
                    type: integer
                    description: Memories reactivated.
                  unfolded:
                    type: integer
                    description: Entity folds and model-decided pairs reversed.
                  skipped:
                    type: integer
                    description: Findings the store has moved on from, left alone.
  /memory/reconcile/{id}/stop:
    post:
      summary: Stop a running reconcile
      description: |
        Abort the run if this daemon is the one running it, and mark the row either way. A run
        whose daemon died mid-sweep has no controller left, and this is the only way its row
        ever leaves `running`. Beliefs the run already checked stay checked, so stopping costs
        nothing beyond the calls already paid for.
      operationId: stopReconcile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Whether a live run was marked stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped:
                    type: boolean
  /memory/reconcile/possible:
    get:
      summary: List possible contradictions
      description: |
        What the contradiction re-check found and nobody has confirmed, newest first. These
        are deliberately **not** conflicts: measured precision for that pass is roughly 40
        percent, so they wait here where dismissing one costs a click. Each one carries the
        verbatim clashing span from both sides, verified against the two memories before the
        row was written, so it can be judged without opening either memory. A finding whose
        two memories are no longer both active drops out of this list.
      operationId: listPossibleContradictions
      responses:
        "200":
          description: Unconfirmed contradictions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  possible:
                    type: array
                    items:
                      $ref: "#/components/schemas/PossibleContradiction"
  /memory/reconcile/possible/{id}/answer:
    post:
      summary: Confirm or dismiss a possible contradiction
      description: |
        `approved` promotes it into a real conflict and returns the conflict id, so it is then
        resolved and reverted like any other. `rejected` records the pair so it is never
        raised again.
      operationId: answerPossibleContradiction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The finding id from the possible list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, rejected]
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: No unanswered possible contradiction with that id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "memloom: no unanswered possible contradiction 8a41c0e2"
        "200":
          description: What answering did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: string
                    enum: [approved, rejected]
                  conflictId:
                    type: string
                    nullable: true
                    description: The conflict row it became. Null on a rejection.
  /context/add:
    post:
      summary: Ingest a file as context
      description: |
        Extract, chunk, embed, and store a .md/.txt/.pdf file from the daemon's machine.
        A document mirrors its file: re-adding an unchanged file is a no-op
        (`unchanged`), a changed file replaces its chunks (`updated`). Markdown chunks carry
        their heading breadcrumb; PDF chunks keep their page number. Chunks surface in normal
        `/memory/query` results with a `source`.
      operationId: contextAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path to a .md, .txt, or .pdf file on this machine.
                  example: C:\Users\me\notes\setup.md
      responses:
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/StoreLocked"
        "200":
          description: What happened to the document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                  outcome:
                    type: string
                    enum: [added, updated, unchanged, converted, exists]
                    description: >-
                      `converted` means the path matched an earlier upload snapshot, which was
                      absorbed into this linked document. `exists` means the content is already
                      present as a linked document.
                  title:
                    type: string
                    example: Deploy Guide
                  chunks:
                    type: integer
                    example: 12
  /context/pick:
    post:
      summary: Open the OS-native file/folder picker
      description: |
        What the viewer's Browse buttons call first. Opens the platform's native file or
        folder dialog on the daemon's machine and returns the chosen absolute paths. Returns
        501 on a system with no native picker (headless Linux without zenity); the viewer
        falls back to /context/browse in that case.
      operationId: pickContextPaths
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum: [file, folder]
                  default: file
      responses:
        "501":
          description: No native file picker available on this system.
        "200":
          description: The chosen paths (empty if the dialog was cancelled).
          content:
            application/json:
              schema:
                type: object
                properties:
                  paths:
                    type: array
                    items:
                      type: string
  /context/browse:
    get:
      summary: Server-side directory listing
      description: |
        Lists one directory on the daemon's machine: subdirectories, plus files whose
        extension has a registered extractor. The viewer's fallback file/folder picker for
        systems with no native dialog; the browser never sees absolute paths from its own
        file inputs, only what this endpoint returns.
      operationId: browseContext
      parameters:
        - name: path
          in: query
          required: false
          schema:
            type: string
          description: Directory to list. Defaults to the home directory.
      responses:
        "400":
          description: Cannot read that directory.
        "200":
          description: The directory listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  parent:
                    type: string
                    nullable: true
                    description: The parent directory, or null at the root.
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        kind:
                          type: string
                          enum: [dir, file]
  /context/documents:
    get:
      summary: List context documents
      operationId: listContextDocuments
      responses:
        "200":
          description: Ingested documents, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        path:
                          type: string
                        title:
                          type: string
                        kind:
                          type: string
                          enum: [md, txt, pdf]
                        chunkCount:
                          type: integer
                        updatedAt:
                          type: string
                          format: date-time
                        watching:
                          type: boolean
                          description: |
                            Re-ingest this document when its file changes. Only meaningful when
                            `watchable` is true; an upload or a web page carries the column's
                            default rather than a considered answer.
                        watchable:
                          type: boolean
                          description: There is a file on disk behind this document.
                        missingAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: |
                            When the file stopped being findable on disk. The chunks stay either
                            way: a deleted source never deletes memory.
  /context/documents/{id}/chunks:
    get:
      summary: Get a document's chunks and their entity edges
      description: |
        One document at chunk granularity: chunks in order, plus their chunk -> entity mention
        edges. The graph endpoint rolls these up to one weighted document -> entity edge; this
        is the drill-down the viewer fetches when a document node is expanded.
      operationId: getDocumentChunks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The chunks and edges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        chunkIndex:
                          type: integer
                        content:
                          type: string
                        headingPath:
                          type: string
                          nullable: true
                          example: Runbook > Restarts
                        page:
                          type: integer
                          nullable: true
                          description: 1-based PDF page, when the chunk came from a PDF.
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        from:
                          type: string
                          description: Chunk id.
                        to:
                          type: string
                          description: Entity id.
                        relation:
                          type: string
                          example: mention
  /context/documents/{id}/open:
    post:
      summary: Open the source file on the daemon's machine
      description: |
        Opens the document's file with the OS default application (what the viewer's
        "Open file" button calls). Only ingested documents can be opened: the path is read
        from the document row looked up by id, so a client can never supply an arbitrary
        path to open.
      operationId: openContextDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The opener was launched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "400":
          description: The document was uploaded from the browser (upload:// provenance); there is no file on disk to open.
        "404":
          description: No document with that id.
  /context/upload:
    post:
      summary: Upload file bytes as a document
      description: |
        Ingest a file whose bytes come from the client. The viewer's Upload button uses
        this, because a browser file dialog yields file bytes without a usable path. The
        document is listed, graphed, and indexed like any other. Its provenance is `upload://<filename>`,
        so re-uploading the same name replaces it and identical bytes are a no-op. Unlike
        path-linked documents there is no disk file to open or change-track; prefer
        /context/add when the daemon can read the file itself. Body limit ~48MB
        (base64 inflates by a third, so roughly a 36MB file).
      operationId: contextUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentBase64]
              properties:
                filename:
                  type: string
                  description: Name with extension; picks the extractor and titles the document.
                  example: notes.md
                contentBase64:
                  type: string
                  description: The file bytes, base64-encoded.
      responses:
        "200":
          description: The ingest outcome (same shape as /context/add for one file).
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId: { type: string, format: uuid }
                  outcome: { type: string, enum: [added, updated, unchanged, converted, exists] }
                  title: { type: string }
                  chunks: { type: integer }
        "400":
          description: Unsupported file type or empty content.
        "413":
          description: File too large.
  /context/documents/{id}:
    delete:
      summary: Remove a context document
      description: Deletes the document and all of its chunks (cascade). The source file on disk is untouched.
      operationId: removeContextDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
  /context/documents/{id}/watch:
    post:
      summary: Start or stop watching one document
      description: |
        Switches file watching for a single document, without touching the folder it came from.
        Nothing already learned changes: the chunks, their embeddings and their entity edges stay
        exactly as they are, and switching it back on re-checks the file on the next pass.

        Only meaningful for a document with a file behind it (`watchable`). Uploads, chat
        attachments and web pages have no path to watch.
      operationId: watchContextDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watching]
              properties:
                watching:
                  type: boolean
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: No document with that id.
  /context/roots:
    get:
      summary: List watched folders
      description: |
        The folders someone linked, as opposed to the documents inside them. Adding a folder
        creates one document per file and would otherwise forget the folder itself, which is the
        only record that files arriving LATER were asked for too.

        `enabled` is false when the daemon has watching switched off (`MEMLOOM_SYNC=off`).
        "Nothing is watched" and "watching is off" are different answers, and a client that
        cannot tell them apart will report the wrong one.
      operationId: listContextRoots
      responses:
        "200":
          description: Linked folders, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                    description: The daemon is watching. False under MEMLOOM_SYNC=off.
                  roots:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        path: { type: string }
                        watching: { type: boolean }
                        documents:
                          type: integer
                          description: Documents in the store whose path sits under this root.
                        lastScanAt:
                          type: string
                          format: date-time
                          nullable: true
                          description: |
                            The catch-up watermark. A rescan only reads entries modified since
                            this, plus anything the store has never seen.
                        createdAt: { type: string, format: date-time }
                  stats:
                    type: object
                    description: Present only while watching is enabled.
                    properties:
                      roots: { type: integer }
                      files:
                        type: integer
                        description: Files watched individually, outside any watched folder.
                      queued:
                        type: integer
                        description: Paths handed to the ingest queue since the daemon started.
                      missing:
                        type: integer
                        description: Documents marked missing since the daemon started.
                      capped:
                        type: boolean
                        description: The last rescan hit the walk cap.
  /context/roots/{id}/watch:
    post:
      summary: Start or stop watching a folder
      description: |
        Its documents and their chunks are untouched either way. Switching it back on re-walks
        the folder on the next pass, so anything that changed while it was off is picked up.
      operationId: watchContextRoot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watching]
              properties:
                watching:
                  type: boolean
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: No root with that id.
  /context/roots/{id}:
    delete:
      summary: Forget a watched folder
      description: |
        Removes the folder from the watch list and KEEPS every document it produced. "Stop
        following this folder" is never "delete what was read in it"; deleting those is
        DELETE /context/documents/{id}, one at a time and deliberately.
      operationId: removeContextRoot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Forgotten. Its documents remain.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: No root with that id.
  /assistant/chat:
    post:
      summary: One assistant turn (SSE)
      description: |
        Run one chat turn through the assistant's agentic loop: the model decides whether to
        call hybrid recall (up to three times), then streams a grounded answer with `[n]`
        citation markers validated against the returned sources. The response is a
        server-sent-event stream of JSON events: `tool_call` and `tool_result` while the
        model searches, `delta` per answer fragment, then one terminal `done` (sessionId,
        messageId, answer, sources) or `error`.

        Omit `sessionId` to start a new chat (titled from this message). `model` overrides
        the configured chat model for this turn only; it must support tool calling on
        OpenRouter. Requires a chat-capable LLM: offline mode answers 503 with a setup hint.
      operationId: assistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: what are my plans for today?
                sessionId:
                  type: string
                  format: uuid
                  description: Continue an existing chat; omit to create one.
                model:
                  type: string
                  description: Per-turn OpenRouter model override (see /assistant/models).
                  example: anthropic/claude-sonnet-5
      responses:
        "200":
          description: The SSE event stream for this turn.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: No chat-capable LLM configured (offline mode).
  /assistant/models:
    get:
      summary: The model catalog for the picker
      description: |
        Tool-capable models from OpenRouter's public catalog (the assistant requires native
        tool calling), shaped for display: USD per million input/output tokens, context
        window, provider (the model id's prefix). Cached daemon-side for an hour; a stale
        copy keeps serving if OpenRouter is unreachable. `defaultModel` is the daemon's
        configured chat model, or null in offline mode.
      operationId: assistantModels
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaultModel:
                    type: [string, "null"]
                    example: google/gemini-2.5-flash
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: anthropic/claude-sonnet-5 }
                        name: { type: string, example: "Anthropic: Claude Sonnet 5" }
                        description: { type: string }
                        contextLength: { type: [integer, "null"], example: 1000000 }
                        promptPer1M: { type: [number, "null"], example: 2 }
                        completionPer1M: { type: [number, "null"], example: 10 }
                        provider: { type: string, example: anthropic }
        "502":
          description: OpenRouter unreachable and no cached copy yet.
  /assistant/sessions:
    get:
      summary: List chat sessions
      description: Starred first, then most recently active.
      operationId: assistantSessions
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssistantSession"
    delete:
      summary: Delete all chat sessions
      description: Removes every session, its messages, and its attachments.
      operationId: clearAssistantSessions
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
  /assistant/sessions/search:
    get:
      summary: Search chat sessions
      description: |
        Hybrid chat search: keyword over titles and message text, plus embedding similarity
        over message content. Each hit carries the best-matching snippet.
      operationId: searchAssistantSessions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching sessions with snippets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/AssistantSession"
                        - type: object
                          properties:
                            snippet: { type: string }
  /assistant/sessions/{id}:
    patch:
      summary: Rename or star a session
      operationId: patchAssistantSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                starred: { type: boolean }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
    delete:
      summary: Delete a session
      description: Removes the session, its messages, and its attached files.
      operationId: deleteAssistantSession
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
  /assistant/sessions/{id}/messages:
    get:
      summary: A session's messages
      description: Oldest first. Assistant messages carry the sources their answer cited.
      operationId: assistantMessages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/AssistantMessage"
  /assistant/sessions/{id}/attachments:
    get:
      summary: A session's attached files
      operationId: sessionAttachments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The attachments (context-document shape, upload provenance).
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        kind: { type: string, example: pdf }
                        chunkCount: { type: integer }
                        path: { type: string, example: "attachment://<sessionId>/brief.pdf" }
                        updatedAt: { type: string }
  /assistant/attachments:
    post:
      summary: Attach a file to a chat
      description: |
        Upload file bytes into one chat's scope. The file is chunked and embedded like a
        document, but only that session's recall searches it: it stays out of the documents
        list, the graph, and entity extraction, and it is deleted with the chat. Omit
        `sessionId` to create the session on the spot (titled 'New chat' until the first
        message names it). Body limit ~48MB (~36MB of file). Remove an attachment with
        DELETE /context/documents/{id}.
      operationId: assistantAttach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentBase64]
              properties:
                filename: { type: string, example: brief.pdf }
                contentBase64: { type: string }
                sessionId:
                  type: string
                  format: uuid
                  description: The chat to attach to; omit to create one.
      responses:
        "200":
          description: The ingest outcome plus the session it landed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, format: uuid }
                  documentId: { type: string, format: uuid }
                  outcome: { type: string, enum: [added, updated, unchanged, converted, exists] }
                  title: { type: string }
                  chunks: { type: integer }
        "400":
          description: Unsupported file type or empty content.
        "404":
          description: No such session.
        "413":
          description: File too large.
  /admin/shutdown:
    post:
      summary: Stop the daemon
      description: |
        Gracefully stop the daemon (what `memloom stop` calls): acknowledges, then closes the
        Postgres wire server, the HTTP server, the store, and releases the data-dir lock.
      operationId: shutdown
      responses:
        "200":
          description: Shutdown acknowledged; the daemon exits right after responding.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  stopping:
                    type: boolean
                    example: true
components:
  responses:
    StoreLocked:
      description: |
        The store is held by a connected Postgres wire client (Drizzle Studio, psql). PGLite is
        single-connection; disconnect that client and retry. All `/memory/*` endpoints can
        return this.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: the store is locked by a connected Postgres wire client (Drizzle Studio, psql, a DB panel). PGLite is single-connection; disconnect that client and retry.
    ValidationError:
      description: The request body failed validation. `issues` names each offending field.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: invalid request body
              issues:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                      example: query
                    message:
                      type: string
                      example: query must be a non-empty string
  schemas:
    SaveInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: The memory text to save.
          example: the staging database runs on Postgres 17
        canonical:
          type: string
          description: Optional short canonical form used for exact-duplicate detection.
          example: staging database engine
        memoryType:
          type: string
          enum: [fact, preference, episode, procedure]
          default: fact
          description: >-
            The kind of memory (defaults to `fact`):
            `fact` is a stable truth about the world or the user;
            `preference` is how the user likes things done;
            `episode` is a time-bound event or decision;
            `procedure` is reusable how-to steps.
          example: fact
        ownerId:
          type: string
          description: Owner UUID. Defaults to the fixed single-user sentinel in the embedded tier.
    SaveResult:
      type: object
      required: [id, outcome]
      properties:
        id:
          type: string
          description: Id of the saved (or merged-into) memory.
        outcome:
          type: string
          enum: [added, merged, versioned, conflict]
          description: >-
            What the belief pipeline did. `versioned` means the save restated an existing
            belief and became its new current version.
        conflictId:
          type: string
          description: Present when `outcome` is `conflict`; resolve it via the conflicts endpoints.
        version:
          type: integer
          description: Present when `outcome` is `versioned`; the new version number (2 or higher).
    Memory:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        status:
          type: string
          enum: [active, stale]
        memoryType:
          type: string
          description: >-
            The kind of memory: one of `fact`, `preference`, `episode`, `procedure`. Recall
            results for ingested context chunks carry the sentinel `context` (see `kind`).
          example: fact
        canonical:
          type: string
          nullable: true
        content:
          type: string
        summary:
          type: string
          nullable: true
        assertedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        similarity:
          type: number
          description: Cosine similarity to the query (meaning signal alone). Present on recall results.
          example: 0.85
        rrfScore:
          type: number
          description: Fused reciprocal-rank-fusion score. Rank-based and small by design. Use it for ordering; it is not a percentage.
          example: 0.0328
        kind:
          type: string
          enum: [memory, context]
          description: Whether this result is a saved memory or a chunk of an ingested context document.
        source:
          type: object
          description: Present on context-chunk results; describes where the text came from.
          properties:
            documentId:
              type: string
            title:
              type: string
              example: Deploy Guide
            path:
              type: string
            headingPath:
              type: string
              nullable: true
              example: Deploy Guide > Database
            page:
              type: integer
              nullable: true
              description: 1-based PDF page.
    Conflict:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        incoming:
          type: object
          properties:
            id:
              type: string
            canonical:
              type: string
              nullable: true
            content:
              type: string
        candidates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              canonical:
                type: string
                nullable: true
              content:
                type: string
              relation:
                type: string
                example: contradictory
              reason:
                type: string
                description: The classifier's explanation of why these contradict.
    ResolvedConflict:
      allOf:
        - $ref: "#/components/schemas/Conflict"
        - type: object
          properties:
            resolution:
              type: string
              enum: [keep_new, keep_existing, keep_both, merge]
              description: The action that resolved it.
            resolvedAt:
              type: string
              format: date-time
    ResolveDecision:
      oneOf:
        - type: object
          title: keep_new
          required: [action]
          properties:
            action:
              type: string
              enum: [keep_new]
              description: The new memory wins; existing candidates go stale.
        - type: object
          title: keep_existing
          required: [action, candidateId]
          properties:
            action:
              type: string
              enum: [keep_existing]
            candidateId:
              type: string
              description: The existing memory that wins; the new one goes stale.
        - type: object
          title: keep_both
          required: [action]
          properties:
            action:
              type: string
              enum: [keep_both]
              description: Mark them distinct; both stay active.
        - type: object
          title: merge
          required: [action, content]
          properties:
            action:
              type: string
              enum: [merge]
            content:
              type: string
              description: The reconciled memory text that supersedes both.
            canonical:
              type: string
    Graph:
      type: object
      properties:
        memories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              canonical:
                type: string
                nullable: true
              content:
                type: string
              memoryType:
                type: string
                enum: [fact, preference, episode, procedure]
                example: fact
        entities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
                example: Postgres
              entityType:
                type: string
                example: technology
        documents:
          type: array
          description: Ingested context documents. Chunk-level mentions roll up to these nodes.
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
                example: runbook.md
              path:
                type: string
                example: /home/me/docs/runbook.md
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              relation:
                type: string
                example: mention
              weight:
                type: integer
                description: On document -> entity edges, how many of the document's chunks mention the entity.
                example: 3
    ImportStatus:
      type: object
      description: Continuous-capture status, what `memloom status` renders for `connect claude-code`.
      properties:
        scope:
          description: The capture allowlist. `null` means nothing is captured yet.
          oneOf:
            - type: string
              enum: [all]
            - type: object
              properties:
                projects:
                  type: array
                  items:
                    type: string
              example: { projects: ["myapp"] }
            - type: "null"
        lastNotifyAt:
          type: string
          format: date-time
          nullable: true
          description: When the daemon last received a session-end notify; null if never.
        lastNotifyError:
          type: string
          nullable: true
          description: The last notify's failure (a provider outage, a missing API key); null if clean.
        todayUnattendedCalls:
          type: integer
          description: Unattended distillation calls spent today.
          example: 4
        unattendedDailyCap:
          type: integer
          example: 200
        sessionsImported:
          type: integer
          description: Ledger total, across import and connect, ever.
        memoriesSaved:
          type: integer
          description: Ledger total memories saved from Claude Code sessions, ever.
    SchemaEntry:
      type: object
      description: One row of the vocabulary registry.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [entity_type, predicate]
        name:
          type: string
          example: medication
        description:
          type: string
        tier:
          type: string
          enum: [system, user, proposed]
        status:
          type: string
          enum: [active, disabled, dismissed]
        occurrences:
          type: integer
          description: How many extraction runs suggested this name (proposals only).
        examples:
          type: array
          description: >-
            The saved occurrences behind a proposal (proposals only). Entity-type proposals
            carry `entity`; predicate proposals carry `from`/`to`/`confidence`. Approval links
            these into the graph without re-indexing.
          items:
            type: object
            properties:
              entity: { type: string }
              from: { type: string }
              to: { type: string }
              confidence: { type: number }
              sourceId: { type: string }
    EntityDetail:
      type: object
      description: An entity with its usage counts.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: PostgreSQL
        entityType:
          type: string
          example: technology
        mentions:
          type: integer
          description: Active mention edges pointing at this entity.
        memories:
          type: integer
          description: Distinct active memories that mention it.
        documents:
          type: integer
          description: Distinct context documents whose chunks mention it.
        aliases:
          type: array
          description: Spellings folded into this entity. Empty when nothing was merged in.
          items:
            type: string
          example: ["Opus 4.8"]
    RelatedEntity:
      type: object
      description: One entity connected to the entity being asked about, and how.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: memloom
        entityType:
          type: string
          example: project
        mentions:
          type: integer
          description: Active mention edges pointing at this entity, so you can weigh it.
        aliases:
          type: array
          items:
            type: string
        links:
          type: array
          description: >-
            Stated relationships between the two. Empty means the connection is co-mention
            only: they turn up in the same memories without the graph asserting how they
            relate.
          items:
            type: object
            properties:
              relation:
                type: string
                example: works_on
              direction:
                type: string
                enum: [out, in]
                description: out when the asked-about entity is the subject, in when it is the object.
              confidence:
                type: number
                nullable: true
        sharedSources:
          type: integer
          description: Distinct memories and chunks that mention both.
    RelatedEntities:
      type: object
      properties:
        entity:
          $ref: "#/components/schemas/EntityDetail"
        matchedAlias:
          type: string
          nullable: true
          description: The spelling asked for, when it was an alias rather than the entity's name.
          example: Bob
        related:
          type: array
          items:
            $ref: "#/components/schemas/RelatedEntity"
        truncated:
          type: integer
          description: Neighbours beyond limit, so a cut answer never reads as a complete one.
    EntityMerge:
      type: object
      description: One reversible fold. The absorbed row is gone from the entity table but fully recoverable from here.
      properties:
        id:
          type: string
          format: uuid
        canonicalId:
          type: string
          format: uuid
        canonicalName:
          type: string
          example: Claude Opus 4.8
        sourceId:
          type: string
          format: uuid
          description: The absorbed entity's original id, restored verbatim on revert.
        sourceName:
          type: string
          example: Opus 4.8
        sourceType:
          type: string
          example: agent
        decidedBy:
          type: string
          enum: [auto, llm, human]
        score:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
          example: identical apart from case and punctuation ("Claude Code" / "claude-code")
        createdAt:
          type: string
          format: date-time
        revertedAt:
          type: string
          format: date-time
          nullable: true
    EntityConflict:
      type: object
      description: An uncertain fold awaiting your decision.
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        incoming:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: PostgreSQL }
            entityType: { type: string, example: technology }
            mentions: { type: integer }
        candidates:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string, example: Postgres }
              entityType: { type: string, example: technology }
              mentions: { type: integer }
              score: { type: number, example: 0.71 }
              reason:
                type: string
                example: spelling variant, 2 character edits apart ("Postgres" / "PostgreSQL")
    EntityResolutionResult:
      type: object
      description: What one resolution pass did.
      properties:
        examined:
          type: integer
          description: Entities considered.
        pairs:
          type: integer
          description: Pairs that survived bucketing and were judged.
        merged:
          type: integer
          description: Folds applied without asking.
        queued:
          type: integer
          description: Uncertain folds written to the conflicts queue.
        deferred:
          type: integer
          description: >-
            Uncertain folds not written because the queue is already full. Reported rather
            than dropped silently, so "nothing queued" never hides "there was more to ask
            about". A later pass picks them up.
        skipped:
          type: integer
          description: Pairs already merged, queued, or settled as distinct.
    SettledEntityPair:
      type: object
      description: Two entity spellings decided to be different things.
      properties:
        id:
          type: string
          format: uuid
        incomingName:
          type: string
        candidateName:
          type: string
        decidedBy:
          type: string
          enum: [auto, llm, human]
        model:
          type: string
          nullable: true
          description: Which model decided, when decidedBy is `llm`.
        reason:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
    ReconcileInput:
      type: object
      description: What to run. Every field is optional.
      properties:
        mode:
          type: string
          enum: [dry_run, apply]
          default: dry_run
          description: >-
            `dry_run` reports and changes nothing, and never calls a model. `apply` acts.
        trigger:
          type: string
          enum: [manual, idle, startup]
          default: manual
          description: Recorded on the run, so the history says who started it.
        passes:
          type: array
          description: >-
            Run exactly these passes, ignoring the saved settings. Omit to use the settings,
            which is what every shipped surface does. This overrides the settings for the three
            paid passes too, so a caller can start a run that spends money while the Settings
            toggles are off. `RECONCILE_ENABLED=0` still refuses it.
          items:
            type: string
            enum: [invariants, entities, llm_entities, llm_conflicts, llm_recheck]
        budgetUsd:
          type: number
          exclusiveMinimum: 0
          maximum: 50
          description: >-
            Keep re-checking past the per-run ceiling until nothing is due or this much has been
            billed, measured against the provider's own reported cost. Omit for one page and
            stop, which is the default. Capped at 50 because a typo here spends real money.
    ReconcileSettings:
      type: object
      description: >-
        Which passes a run does. The two free passes are on by default and the three that
        spend money are off, because a pass whose work the ledger can undo needs no permission
        and one that spends does. Every field is optional on a write.
      properties:
        invariants:
          type: boolean
          default: true
          description: Fix memory principle violations. Free, acts on its own.
        entities:
          type: boolean
          default: true
          description: Resolve duplicate entities. Free, acts on its own.
        llm_entities:
          type: boolean
          default: false
          description: Let a model resolve uncertain entity pairs. One call per pair.
        llm_conflicts:
          type: boolean
          default: false
          description: Let a model resolve memory conflicts. One call per conflict.
        llm_recheck:
          type: boolean
          default: false
          description: >-
            Look for contradictions the save path could not see. Up to 200 calls per run,
            roughly $0.55 at the ceiling.
        startupCatchUp:
          type: boolean
          default: true
          description: >-
            Run the free passes shortly after the daemon starts when the last run is more than
            36 hours old.
    ReconcileRun:
      type: object
      description: One run, and what it did.
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [dry_run, apply]
        trigger:
          type: string
          enum: [manual, idle, startup]
        status:
          type: string
          enum: [running, success, error, aborted]
        scanned:
          type: integer
          description: Active memories the run looked at.
        retired:
          type: integer
          description: Memories staled. Never deleted, and undo puts them back.
        folded:
          type: integer
          description: Entities folded into another.
        questions:
          type: integer
          description: Findings reported rather than fixed.
        conflictsRaised:
          type: integer
        possible:
          type: integer
          description: >-
            Unconfirmed contradictions the re-check recorded. Not conflicts until a human says
            so.
        llmCalls:
          type: integer
        spentUsd:
          type: number
          description: >-
            What the run actually cost, from the provider's own billed figures. Written per call,
            so it survives a crash mid-sweep.
        spentInputTokens:
          type: integer
        spentOutputTokens:
          type: integer
        error:
          type: string
          nullable: true
          description: Why a run with status `error` failed. Null otherwise.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        revertedAt:
          type: string
          format: date-time
          nullable: true
    ReconcileAction:
      type: object
      description: One thing a run found.
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [retire, question, conflict, fold, possible]
          description: >-
            `retire` and `fold` changed state. `question` and `conflict` ask you. `possible` is
            an unconfirmed contradiction from the re-check.
        class:
          type: string
          description: The detector behind it.
          example: duplicate_content
        memoryId:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          example: identical content to 41b0e2d8, which is older and stays active
        applied:
          type: boolean
          description: True only when an applying run actually changed something here.
        surfaced:
          type: boolean
          description: False when the finding was recorded but held back by a per-run cap.
        decision:
          type: string
          enum: [approved, rejected, snoozed]
          nullable: true
        mergeId:
          type: string
          format: uuid
          nullable: true
          description: On a fold, the merge record the undo reverses.
        conflictId:
          type: string
          format: uuid
          nullable: true
          description: On a conflict, the queue row this finding became.
        candidateId:
          type: string
          format: uuid
          nullable: true
          description: On a possible contradiction, the older belief of the pair.
        createdAt:
          type: string
          format: date-time
    ReconcileEstimate:
      type: object
      description: >-
        What re-checking everything currently due would cost, from the real prompt template
        and the actual content lengths. A dry run reports this instead of spending it. One run
        is capped at 200 beliefs, so on a store with a backlog this is what several runs add up
        to.
      properties:
        window:
          type: integer
          description: Active memories due a contradiction re-check.
        llmCalls:
          type: integer
          description: One per memory in the window.
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        model:
          type: string
          example: google/gemini-2.5-flash
        usd:
          type: number
          nullable: true
          description: >-
            Null for a model whose rates memloom does not know, rather than a confident wrong
            number.
    ReconcileReport:
      type: object
      description: One run's own words. This is what the CLI prints and the Settings tab renders.
      properties:
        run:
          $ref: "#/components/schemas/ReconcileRun"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ReconcileAction"
        estimate:
          $ref: "#/components/schemas/ReconcileEstimate"
        passes:
          type: array
          items:
            type: string
          description: The passes this run actually ran.
        heldBack:
          type: object
          description: Findings recorded but not surfaced, because a per-run cap was reached.
          properties:
            retire: { type: integer }
            question: { type: integer }
            conflict: { type: integer }
        entities:
          $ref: "#/components/schemas/EntityResolutionResult"
        arbitration:
          type: object
          description: Present when the uncertain entity pairs pass ran.
          properties:
            calls: { type: integer }
            folded: { type: integer }
            rejected:
              type: integer
              description: Pairs the model said are different things. Recorded, so it is never asked again.
            unsure:
              type: integer
              description: Left pending for a human.
        autoResolved:
          type: object
          description: Present when the memory conflicts pass ran.
          properties:
            examined: { type: integer }
            resolved: { type: integer }
        recheck:
          type: object
          description: Present when the contradiction re-check ran.
          properties:
            window:
              type: integer
              description: Beliefs this run swept.
            calls: { type: integer }
            claimed:
              type: integer
              description: Contradictions the model claimed, before the quotes were checked.
            verified:
              type: integer
              description: Findings whose quotes were found in both memories, and were recorded.
            remaining:
              type: integer
              description: Beliefs still due when the run stopped.
            spentUsd:
              type: number
              description: Billed for this pass, from the provider's own figures.
            spentInputTokens:
              type: integer
            spentOutputTokens:
              type: integer
            stoppedBy:
              type: string
              nullable: true
              enum: [budget, aborted, cap, unpriced, failed]
              description: >-
                Why it stopped short. `cap` is the per-run ceiling with no budget set, `budget`
                is the spend limit, `aborted` is a stop, `unpriced` means a budget was set but
                the provider reported no cost so the run refused to page on blind, and `failed`
                means every call in a page failed. Null means nothing is due any more.
    PossibleContradiction:
      type: object
      description: >-
        One unconfirmed contradiction, with the spans that make it readable without opening
        either memory. Both quotes were verified against the two contents before the row was
        written, so they are guaranteed to occur in them.
      properties:
        id:
          type: string
          format: uuid
          description: The finding id. Answering quotes it back.
        runId:
          type: string
          format: uuid
        newMemory:
          type: object
          properties:
            id: { type: string, format: uuid }
            content: { type: string }
        oldMemory:
          type: object
          properties:
            id: { type: string, format: uuid }
            content: { type: string }
        newQuote:
          type: string
          description: The verbatim span from newMemory making its claim.
        oldQuote:
          type: string
          description: The verbatim span from oldMemory making the opposing claim.
        reason:
          type: string
          description: The model's own words, kept to 12 words by the prompt.
        model:
          type: string
          nullable: true
        similarity:
          type: number
          nullable: true
          description: Cosine between the two beliefs. The same ordering signal the conflict queue uses.
        foundAt:
          type: string
          format: date-time
    AssistantSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: what are my plans for today?
        isStarred:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
    AssistantMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        sources:
          type: array
          description: The passages an assistant answer cited (empty on user messages).
          items:
            $ref: "#/components/schemas/AssistantSource"
        createdAt:
          type: string
    AssistantSource:
      type: object
      description: One recall hit an answer was grounded in; `n` matches the `[n]` markers in the text.
      properties:
        n:
          type: integer
          example: 1
        kind:
          type: string
          enum: [memory, context]
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "runbook.pdf › Database failover"
        snippet:
          type: string
          description: The passage exactly as the model saw it.
        similarity:
          type: number
          example: 0.81
        date:
          type: string
          description: The memory's assertion day, YYYY-MM-DD (absent on context chunks).
        memoryType:
          type: string
          enum: [fact, preference, episode, procedure]
          description: Absent on context chunks.
        rrfScore:
          type: number
        graphNodeId:
          type: string
          format: uuid
          description: The graph node this source maps to (the memory, or the chunk's parent document).
