# memloom on Fly.io. `fly launch --no-deploy` renames the app; secrets are set with
# `fly secrets set` and never live in this file. Walkthrough: docs/guides/hosting.mdx.

app = "memloom"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # Also set here, not only in the Dockerfile, so `fly ssh console` shells find the same store.
  MEMLOOM_HOME = "/data/.memloom"
  MEMLOOM_SYNC = "off"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Memory is only useful if it answers when an agent asks, and a stopped machine takes a few
  # seconds to wake. Keep one running; the cost is the same machine either way.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# The store lives here, the same embedded PGLite folder a laptop uses. Create it once with
# `fly volumes create memloom_data --size 3`. Fly snapshots volumes daily.
[mounts]
  source = "memloom_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
